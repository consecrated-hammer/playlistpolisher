version: 2
updates:
  # Enable version updates for npm (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  # Enable version updates for pip (backend)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  # Enable version updates for Docker (root image)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  # Enable version updates for Docker (backend image)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  # Enable version updates for Docker (frontend image)
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]
